[project]
name = "fasturl"
version = "0.1.0"
description = "High-performance URL shortener built with FastAPI, PostgreSQL, Redis, and Next.js"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "FastURL Contributors" }
]
keywords = ["fastapi", "url-shortener", "redis", "postgresql", "nextjs"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.0",
    "slowapi>=0.1.9",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyjwt>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "pwdlib[argon2]>=0.2.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "email-validator>=2.1.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "faker>=30.0.0",
    "locust>=2.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
